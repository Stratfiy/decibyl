name: Import approved Scene 2 creative

on:
  push:
    branches:
      - codex/scene-one-cinematic
    paths:
      - .github/workflows/import-scene-two.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/scene-one-cinematic
      - name: Import optimized Scene 2 asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/media/scene-two
          curl --fail --location --silent --show-error \
            'https://tempfile.aiquickdraw.com/workers/images/image_343062d25e6b6f9199e7bde9f860ab00.png' \
            --output public/media/scene-two/decibyl-business-selector.png
          test -s public/media/scene-two/decibyl-business-selector.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/scene-two/decibyl-business-selector.png
          git rm .github/workflows/import-scene-two.yml
          git commit -m 'Add approved Scene 2 business selector creative'
          git push origin HEAD:codex/scene-one-cinematic
